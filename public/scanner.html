<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1115">
  <title>Door scanner</title>
  <link rel="manifest" href="/scanner.webmanifest">
  <style>
    :root { --bg:#0e1115; --panel:#171b21; --ink:#eef1f4; --muted:#9aa3ae; --line:#29303a; --ok:#1f9d55; --warn:#c98a00; --bad:#d64545; --accent:#6b9bff; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    header { display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); }
    header b { flex:1; }
    .pill { font-size:13px; padding:2px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
    .pill.on { color:var(--ok); border-color:var(--ok); }
    main { padding:14px; display:grid; gap:14px; max-width:640px; margin:0 auto; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; }
    video { width:100%; border-radius:12px; background:#000; aspect-ratio:4/3; object-fit:cover; }
    #result { border-radius:14px; padding:22px 16px; text-align:center; font-size:22px; font-weight:700; min-height:96px; }
    #result small { display:block; font-size:15px; font-weight:500; opacity:.9; margin-top:4px; }
    .ok { background:var(--ok); } .warn { background:var(--warn); color:#111; } .bad { background:var(--bad); } .idle { background:var(--panel); color:var(--muted); font-weight:500; }
    input, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    button { cursor:pointer; } button.primary { background:var(--accent); border-color:var(--accent); color:#0b0d10; font-weight:600; }
    .row { display:flex; gap:8px; } .row input { flex:1; min-width:0; }
    .stats { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; text-align:center; }
    .stats b { display:block; font-size:22px; }
    .muted { color:var(--muted); font-size:14px; }
    :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header><b id="title">Door scanner</b><span id="net" class="pill">offline</span></header>
  <main>
    <section id="setup" class="card" hidden>
      <p>Paste the scanner token the organiser gave you. It is stored on this device only.</p>
      <div class="row"><label class="muted" for="token" hidden>Scanner token</label>
        <input id="token" placeholder="scn_…" autocomplete="off"><button id="save" class="primary">Start</button></div>
    </section>
    <section id="scan" hidden>
      <div id="result" class="idle" role="status" aria-live="assertive">Point the camera at a ticket</div>
      <video id="video" playsinline muted></video>
      <div class="card stats">
        <div><b id="admitted">0</b><span class="muted">admitted</span></div>
        <div><b id="expected">0</b><span class="muted">expected</span></div>
        <div><b id="queued">0</b><span class="muted">to sync</span></div>
      </div>
      <div class="card">
        <div class="row"><label class="muted" for="manual" hidden>Ticket code</label>
          <input id="manual" placeholder="Or type or paste a ticket code"><button id="check">Check</button></div>
        <p class="muted" id="synced"></p>
        <div class="row"><button id="refresh">Refresh guest list</button><button id="forget">Sign out</button></div>
      </div>
    </section>
  </main>
  <script src="/vendor/jsQR.js"></script>
  <script type="module" src="/scanner.js"></script>
</body>
</html>
